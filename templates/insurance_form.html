{% extends "base.html" %}
{% block title %}Edytuj OC — {{ car.make }} {{ car.model }}{% endblock %}
{% block content %}
<h2>Edytuj polisę OC — {{ car.make }} {{ car.model }}</h2>
<form method="post" class="row g-3">
  <div class="col-md-3">
    <label class="form-label">Ważne od</label>
    <input type="date" name="valid_from" class="form-control" value="{{ policy.valid_from }}" required>
  </div>
  <div class="col-md-3">
    <label class="form-label">Ważne do</label>
    <input type="date" name="valid_to" class="form-control" value="{{ policy.valid_to }}" required>
  </div>
  <div class="col-md-3">
    <label class="form-label">Ubezpieczyciel</label>
    <input type="text" name="insurer" class="form-control" value="{{ policy.insurer or '' }}">
  </div>
  <div class="col-md-3">
    <label class="form-label">Nr polisy</label>
    <input type="text" name="policy_no" class="form-control" value="{{ policy.policy_no or '' }}">
  </div>
  <div class="col-12 d-flex gap-2">
    <button class="btn btn-primary">Zapisz</button>
    <a class="btn btn-secondary" href="{{ url_for('car_detail', car_id=car.id) }}">Anuluj</a>
  </div>
</form>
{% endblock %}

{% extends "base.html" %}
{% block title %}Edytuj pozycję serwisową{% endblock %}
{% block content %}
<h2 class="mb-3">Edytuj pozycję — {{ item.service.title }}</h2>
<form method="post" class="card p-3">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% include "service_item_fields.html" %}
  <div class="mt-3 d-flex gap-2">
    <button class="btn btn-primary">Zapisz</button>
    <a class="btn btn-secondary" href="{{ url_for('service_edit', service_id=item.service_id) }}">Anuluj</a>
  </div>
</form>
{% endblock %}
